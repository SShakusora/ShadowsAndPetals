name: Build Latest JAR

on:
  push:
    branches:
      - "26.1.2/Teacon"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shadowsandpetals-26.1.2-latest-jar
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build JAR
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Prepare latest JAR
        shell: bash
        run: |
          mapfile -t jars < <(
            find build/libs -maxdepth 1 -type f \
              -name '*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar'
          )

          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "Expected exactly one distributable JAR, found ${#jars[@]}" >&2
            printf '  %s\n' "${jars[@]}" >&2
            exit 1
          fi

          cp "${jars[0]}" build/libs/ShadowsAndPetals-latest.jar

      - name: Create or update latest-build release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_notes="Automatically built from commit ${GITHUB_SHA}."

          if gh release view latest-build >/dev/null 2>&1; then
            gh release upload latest-build \
              build/libs/ShadowsAndPetals-latest.jar \
              --clobber
            gh release edit latest-build --notes "$release_notes"
          else
            gh release create latest-build \
              build/libs/ShadowsAndPetals-latest.jar \
              --target "$GITHUB_SHA" \
              --title "Latest Development Build" \
              --notes "$release_notes" \
              --prerelease
          fi
